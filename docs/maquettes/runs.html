<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Exécutions · Maquette Relais</title>
    <link rel="stylesheet" href="suivi.css" />
    <script type="module" src="runs.js"></script>
  </head>
  <body>
    <main id="contenu">
      <header class="page-head">
        <div class="crumb">
          Console <i data-icon="ChevronRight"></i> Exécutions
        </div>
        <h1>Exécutions</h1>
      </header>
      <section class="journal" aria-labelledby="journal-title">
        <div class="section-heading">
          <h2 id="journal-title">Journal des appels</h2>
          <label class="quiet-select"
            ><i data-icon="CalendarDays"></i
            ><select id="period" aria-label="Période">
              <option value="all">Toutes les dates</option>
              <option value="18">18 novembre</option>
              <option value="17">17 novembre</option>
            </select></label
          >
        </div>
        <div class="tools">
          <label class="search"
            ><i data-icon="Search"></i
            ><input
              type="search"
              placeholder="Rechercher une simulation…"
              aria-label="Rechercher une simulation"
          /></label>
          <label class="select"
            ><span>Code HTTP</span
            ><select id="http" aria-label="Code HTTP">
              <option value="">Tous</option>
              <option value="2">2xx</option>
              <option value="4">4xx</option>
              <option value="5">5xx</option>
            </select></label
          >
          <label class="select"
            ><span>Webhook</span
            ><select id="hook" aria-label="Webhook">
              <option value="">Tous</option>
              <option>Livré</option>
              <option>Planifié</option>
              <option>En échec</option>
              <option>Sans webhook</option>
            </select></label
          >
        </div>
        <div class="list-meta" role="status" id="total"></div>
        <div id="journal"></div>
      </section>
      <dialog id="run-detail">
        <button class="close" aria-label="Fermer"><i data-icon="X"></i></button>
        <h2></h2>
        <dl></dl>
      </dialog>
    </main>
  </body>
</html>
