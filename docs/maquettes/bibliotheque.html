<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bibliothèque des simulations · Maquette Relais</title>
    <style>
      :root {
        --ink: #172724;
        --muted: #54665f;
        --line: #d8dfd8;
        --accent: #ad452b;
        --paper: #f7f8f4;
        --panel: #152a26;
        --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font:
          15px/1.5 Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      * {
        box-sizing: border-box;
      }
      body,
      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button,
      a,
      input,
      select {
        touch-action: manipulation;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
      }
      button:disabled {
        cursor: default;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      :focus-visible {
        outline: 3px solid #ce663f;
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      svg {
        width: 17px;
        height: 17px;
        flex: none;
      }
      code,
      .mono {
        font-family: var(--mono);
      }
      .wrap {
        max-width: 1304px;
        margin: auto;
        padding-inline: clamp(24px, 5vw, 76px);
      }
      .bar {
        background: white;
        border-bottom: 1px solid var(--line);
      }
      .bar .wrap,
      .logo,
      nav,
      .scope,
      .hero,
      .cta,
      .summary,
      .rowHead,
      .route,
      .tabs,
      .tools,
      .search,
      .filter,
      .previewHead,
      .file,
      .tagLine,
      .context,
      .closeBtn {
        display: flex;
        align-items: center;
      }
      .bar .wrap {
        min-height: 70px;
        gap: 44px;
        position: relative;
      }
      .logo {
        font-size: 23px;
        font-weight: 750;
        letter-spacing: -1.2px;
        gap: 9px;
      }
      .logo i {
        background: var(--accent);
        border-radius: 8px;
        color: white;
        width: 31px;
        height: 32px;
        display: grid;
        place-items: center;
      }
      .logo svg {
        width: 22px;
        height: 22px;
      }
      nav {
        align-self: stretch;
        gap: 25px;
      }
      nav a {
        display: flex;
        align-items: center;
        font-size: 14px;
        color: var(--muted);
        position: relative;
      }
      nav [aria-current] {
        color: var(--ink);
        font-weight: 650;
      }
      nav [aria-current]:after {
        content: "";
        position: absolute;
        bottom: -1px;
        inset-inline: 0;
        height: 3px;
        background: var(--ink);
      }
      .scope {
        position: relative;
        margin-left: auto;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
      }
      .scope select {
        appearance: none;
        border: 0;
        background: none;
        cursor: pointer;
        padding: 10px 23px 10px 0;
        font-weight: 600;
      }
      .scope svg:last-child {
        position: absolute;
        right: 0;
        pointer-events: none;
        width: 14px;
      }
      .navBtn {
        display: none;
      }
      .hero {
        justify-content: space-between;
        gap: 20px;
        padding: clamp(32px, 4vw, 58px) 0 30px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: clamp(39px, 4.4vw, 60px);
        line-height: 1.05;
        letter-spacing: -0.063em;
        font-weight: 650;
      }
      .summary {
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .summary span + span {
        border-left: 1px solid #c4cdc4;
        padding-left: 12px;
      }
      .summary b {
        color: var(--ink);
      }
      .cta,
      .secondary {
        min-height: 43px;
        gap: 8px;
        justify-content: center;
        padding: 0 15px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 620;
      }
      .cta {
        background: var(--ink);
        color: white;
      }
      .cta:hover {
        background: #30483f;
      }
      .secondary,
      .filter {
        background: white;
        border: 1px solid #cbd4cc;
      }
      .secondary:hover,
      .filter:hover {
        background: #eef1eb;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.85fr) minmax(267px, 1fr);
        gap: clamp(24px, 4vw, 56px);
        margin: 29px 0 56px;
        align-items: start;
      }
      .listcol {
        min-width: 0;
      }
      .tabs {
        border-bottom: 1px solid var(--line);
        gap: 26px;
      }
      .tabs button {
        position: relative;
        padding: 0 1px 12px;
        min-height: 40px;
        color: var(--muted);
        font-size: 14px;
        white-space: nowrap;
      }
      .tabs [aria-pressed="true"] {
        color: var(--ink);
        font-weight: 650;
      }
      .tabs [aria-pressed="true"]:after {
        position: absolute;
        content: "";
        bottom: -1px;
        height: 3px;
        inset-inline: 0;
        background: var(--accent);
      }
      .count {
        font: 11px var(--mono);
        padding: 2px 5px;
        background: #e6ebe3;
        border-radius: 4px;
        margin-left: 5px;
        color: #45594b;
      }
      .tools {
        gap: 8px;
        margin: 18px 0;
      }
      .search,
      .filter {
        height: 41px;
        border: 1px solid #cbd4cc;
        border-radius: 7px;
        background: white;
      }
      .search {
        flex: 1;
        min-width: 0;
        padding-inline: 12px;
        color: var(--muted);
        gap: 8px;
      }
      .search input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: none;
        background: none;
        font-size: 14px;
      }
      .search:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .filter {
        gap: 7px;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .filter[aria-expanded="true"] {
        background: #e9eee7;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px;
        margin: -4px 0 16px;
        background: #edf1e9;
        padding: 12px;
        border-radius: 7px;
      }
      .filters label,
      dialog label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .filters select,
      dialog input,
      dialog select {
        font-size: 14px;
        border: 1px solid #c5d0c5;
        background: white;
        padding: 7px 9px;
        border-radius: 5px;
      }
      .filters button {
        color: var(--accent);
        font-size: 13px;
        min-height: 36px;
      }
      .rows {
        border-top: 1px solid var(--line);
      }
      .row {
        position: relative;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--line);
        gap: 10px;
      }
      .row.chosen {
        background: #eaf0e7;
        box-shadow: inset 3px 0 #4e6e56;
      }
      .row:hover {
        background: #edf1eb;
      }
      .selectRow {
        flex: 1;
        min-width: 0;
        text-align: left;
        padding: 14px 0 14px 16px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        column-gap: 14px;
        align-items: center;
      }
      .rowHead {
        gap: 8px;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.025em;
      }
      .route {
        gap: 8px;
        color: #475b51;
        font-size: 12px;
        margin-top: 3px;
      }
      .route b {
        color: #36583d;
        font: 600 10px var(--mono);
        letter-spacing: 0.04em;
      }
      .rowContext {
        font-size: 12px;
        color: var(--muted);
        margin-top: 2px;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #465f4b;
        background: #e6efe4;
        border-radius: 5px;
        white-space: nowrap;
        padding: 3px 7px;
      }
      .state:before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #53815d;
      }
      .state.draft {
        background: #f6ebd7;
        color: #78591e;
      }
      .draft:before {
        background: #b48634;
      }
      .state.archived {
        background: #e7eae7;
        color: #56615b;
      }
      .archived:before {
        background: #79867d;
      }
      .more,
      .closeBtn,
      .navBtn {
        width: 44px;
        min-height: 44px;
        flex-shrink: 0;
      }
      .row .more {
        margin-right: 3px;
      }
      .more:hover,
      .closeBtn:hover {
        background: #dfe6dd;
        border-radius: 6px;
      }
      .menu {
        position: absolute;
        z-index: 3;
        right: 4px;
        top: 65%;
        min-width: 166px;
        border: 1px solid var(--line);
        background: white;
        border-radius: 8px;
        padding: 5px;
        box-shadow: 0 8px 24px #1727241c;
      }
      .menu button {
        display: block;
        text-align: left;
        padding: 9px;
        width: 100%;
        font-size: 13px;
      }
      .menu button:hover {
        background: #eef1eb;
      }
      .empty {
        padding: 30px 0;
        color: var(--muted);
      }
      .empty button {
        color: var(--accent);
        padding: 8px 0;
      }
      .preview {
        border-left: 1px solid var(--line);
        padding-left: clamp(18px, 2.5vw, 36px);
        min-width: 0;
      }
      .previewHead {
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 15px;
      }
      .previewHead h2 {
        font-size: 16px;
        letter-spacing: -0.03em;
      }
      .previewHead svg {
        color: var(--muted);
      }
      .preview h3,
      dialog h2 {
        font-size: clamp(22px, 2vw, 29px);
        line-height: 1.17;
        letter-spacing: -0.045em;
        margin: 10px 0;
      }
      .context {
        font-size: 13px;
        color: var(--muted);
        gap: 7px;
        margin-bottom: 18px;
      }
      .context svg {
        width: 14px;
      }
      .tagLine {
        justify-content: space-between;
      }
      .version {
        font: 12px var(--mono);
        color: var(--muted);
      }
      .payload {
        border-radius: 9px;
        background: var(--panel);
        color: #d6e6df;
        overflow: hidden;
      }
      .file {
        justify-content: space-between;
        gap: 6px;
        padding: 13px 15px;
        border-bottom: 1px solid #375048;
        font: 12px var(--mono);
      }
      .http {
        padding: 2px 6px;
        background: #f7e7dc;
        color: #914321;
        border-radius: 4px;
        font: 600 11px var(--mono);
      }
      .http.ok {
        background: #dcebdc;
        color: #345741;
      }
      .payload pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 16px;
        margin: 0;
        font: 12px/1.85 var(--mono);
      }
      .k {
        color: #a4d8c8;
      }
      .v {
        color: #f4c898;
      }
      .preview dl {
        margin-top: 16px;
        font-size: 13px;
      }
      .preview dl div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      dt {
        color: var(--muted);
      }
      dd {
        text-align: right;
      }
      .preview .secondary {
        width: 100%;
        display: flex;
        align-items: center;
        margin-top: 16px;
      }
      .preview .closeBtn {
        display: none;
      }
      .emptyPreview {
        color: var(--muted);
        font-size: 14px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      dialog {
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        max-width: min(460px, 92vw);
        width: 100%;
        padding: 24px;
      }
      dialog::backdrop {
        background: #10231d70;
      }
      dialog header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 14px;
      }
      dialog header h2 {
        margin: 5px 0 12px;
      }
      dialog form {
        display: grid;
        gap: 15px;
      }
      dialog p {
        color: var(--muted);
        font-size: 14px;
      }
      .closeBtn {
        justify-content: center;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 7px;
        background: var(--ink);
        color: white;
        padding: 8px 15px;
        z-index: 5;
        font-size: 13px;
      }
      .toast:empty {
        display: none;
      }
      .sheet {
        padding: 20px;
      }
      .sheet .preview {
        border: 0;
        padding: 0;
      }
      .sheet .preview .closeBtn {
        display: grid;
        place-items: center;
      }
      .sheet .previewHead {
        margin-bottom: 6px;
      }
      @media (max-width: 850px) {
        .bar .wrap {
          gap: 20px;
        }
        nav {
          gap: 16px;
        }
        .grid {
          gap: 22px;
          grid-template-columns: minmax(0, 1.55fr) minmax(238px, 1fr);
        }
        .wrap {
          padding-inline: 24px;
        }
        .tabs {
          gap: 15px;
        }
        .selectRow {
          column-gap: 5px;
        }
        .row {
          gap: 1px;
        }
      }
      @media (max-width: 700px) {
        .wrap {
          padding-inline: 18px;
        }
        .bar .wrap {
          min-height: 54px;
          gap: 8px;
        }
        .navBtn {
          display: grid;
          place-items: center;
        }
        .bar nav {
          display: none;
        }
        .bar nav.open {
          display: grid;
          position: absolute;
          z-index: 3;
          inset: 100% 0 auto;
          gap: 0;
          background: white;
          border-bottom: 1px solid var(--line);
          padding: 8px 18px;
        }
        .bar nav a {
          min-height: 44px;
        }
        .bar nav [aria-current]:after {
          display: none;
        }
        .scope {
          gap: 5px;
        }
        .hero {
          display: block;
          padding: 25px 0 20px;
        }
        .hero .cta {
          margin-top: 16px;
        }
        .summary {
          gap: 8px;
          font-size: 12px;
          row-gap: 4px;
        }
        .summary span + span {
          padding-left: 8px;
        }
        .grid {
          display: block;
          margin-top: 16px;
        }
        .grid > aside {
          display: none;
        }
        .tabs {
          gap: clamp(12px, 4vw, 20px);
        }
        .tabs button {
          font-size: 13px;
          min-height: 44px;
          padding-bottom: 8px;
        }
        .count {
          margin-left: 3px;
        }
        .tools {
          margin: 14px 0;
        }
        .search,
        .filter {
          height: 44px;
        }
        .selectRow {
          padding: 12px 0 12px 10px;
        }
        .rowHead {
          font-size: 15px;
        }
        .state {
          font-size: 11px;
        }
        .more {
          width: 38px;
        }
        .rowContext {
          font-size: 11px;
        }
        .route {
          font-size: 11px;
        }
        .row.chosen:not(:hover) {
          box-shadow: none;
          background: none;
        }
        .sheet {
          margin: auto auto 0;
          border-bottom-left-radius: 0;
          border-bottom-right-radius: 0;
          width: 100%;
          max-width: 100%;
          padding: 18px 20px max(25px, env(safe-area-inset-bottom));
          max-height: 90dvh;
        }
        .filters label {
          flex: 1;
          min-width: 100px;
        }
        .filters select {
          width: 100%;
        }
      }
      @media (max-width: 360px) {
        .bar .wrap {
          padding-inline: 12px;
          gap: 4px;
        }
        .scope {
          min-width: 0;
        }
        .scope select {
          min-width: 0;
          max-width: 124px;
        }
        .tabs {
          gap: 9px;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="wrap">
        <a class="logo" href="bibliotheque.html"
          ><i
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-layers-2"
              aria-hidden="true"
            >
              <path
                d="M13 13.74a2 2 0 0 1-2 0L2.5 8.87a1 1 0 0 1 0-1.74L11 2.26a2 2 0 0 1 2 0l8.5 4.87a1 1 0 0 1 0 1.74z"
              ></path>
              <path
                d="m20 14.285 1.5.845a1 1 0 0 1 0 1.74L13 21.74a2 2 0 0 1-2 0l-8.5-4.87a1 1 0 0 1 0-1.74l1.5-.845"
              ></path></svg></i
          >Relais</a
        ><button
          class="navBtn"
          id="navBtn"
          aria-label="Menu de navigation"
          aria-controls="nav"
          aria-expanded="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu"
            aria-hidden="true"
          >
            <path d="M4 5h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 19h16"></path>
          </svg>
        </button>
        <nav id="nav" aria-label="Navigation principale">
          <a href="http://127.0.0.1:3210/#/projects">Projets</a
          ><a href="bibliotheque.html" aria-current="page">Bibliothèque</a
          ><a href="trace.html">Exécutions</a
          ><a href="http://127.0.0.1:3210/#/health">Notifications</a>
        </nav>
        <label class="scope"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-folder"
            aria-hidden="true"
          >
            <path
              d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
            ></path></svg
          ><select id="project" aria-label="Filtrer par projet">
            <option value="">Tous les projets</option>
            <option>Atlas</option>
            <option>Studio</option></select
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-down"
            aria-hidden="true"
          >
            <path d="m6 9 6 6 6-6"></path></svg
        ></label>
      </div>
    </header>
    <main class="wrap">
      <header class="hero">
        <div>
          <h1>Bibliothèque</h1>
          <div id="summary" class="summary"></div>
        </div>
        <button id="create" class="cta">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-plus"
            aria-hidden="true"
          >
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path></svg
          >Nouvelle simulation
        </button>
      </header>
      <div class="grid">
        <section class="listcol" aria-label="Simulations">
          <div class="tabs" role="group" aria-label="Accès aux simulations">
            <button data-access="Toutes" aria-pressed="true">
              Toutes <span class="count"></span></button
            ><button data-access="Mes projets" aria-pressed="false">
              Mes projets <span class="count"></span></button
            ><button data-access="Partagées" aria-pressed="false">
              Partagées <span class="count"></span>
            </button>
          </div>
          <div class="tools">
            <label class="search"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-search"
                aria-hidden="true"
              >
                <path d="m21 21-4.34-4.34"></path>
                <circle cx="11" cy="11" r="8"></circle></svg
              ><input
                id="search"
                type="search"
                aria-label="Rechercher une simulation"
                placeholder="Nom ou route…" /></label
            ><button
              class="filter"
              id="toggleFilters"
              aria-expanded="false"
              aria-controls="filters"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-sliders-horizontal"
                aria-hidden="true"
              >
                <path d="M10 5H3"></path>
                <path d="M12 19H3"></path>
                <path d="M14 3v4"></path>
                <path d="M16 17v4"></path>
                <path d="M21 12h-9"></path>
                <path d="M21 19h-5"></path>
                <path d="M21 5h-7"></path>
                <path d="M8 10v4"></path>
                <path d="M8 12H3"></path></svg
              ><span>Filtres</span>
            </button>
          </div>
          <div id="filters" class="filters" hidden>
            <label
              >Statut<select id="state">
                <option value="">Tous</option>
                <option>Active</option>
                <option>Brouillon</option>
                <option>Archivée</option>
              </select></label
            ><label
              >Service<select id="service">
                <option value="">Tous</option>
              </select></label
            ><label
              >Environnement<select id="environment">
                <option value="">Tous</option>
                <option>Recette</option>
                <option>Intégration</option>
              </select></label
            ><button data-action="reset">Réinitialiser</button>
          </div>
          <div class="rows" id="rows"></div>
          <p id="results" class="sr" role="status"></p>
        </section>
        <aside
          id="desktopPreview"
          class="preview"
          aria-label="Aperçu de la simulation"
        ></aside>
      </div>
    </main>
    <dialog
      id="mobilePreview"
      class="sheet"
      aria-label="Aperçu de la simulation"
    >
      <div class="preview"></div>
    </dialog>
    <dialog id="modal" aria-labelledby="dialogTitle">
      <header>
        <h2 id="dialogTitle"></h2>
        <button class="closeBtn" data-action="close" aria-label="Fermer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x"
            aria-hidden="true"
          >
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </header>
      <form id="modalForm"></form>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script>
      // All changes affect only these examples and last until the page is reloaded.
      const items = [
        {
          id: "refus",
          name: "Refus explicite",
          method: "POST",
          route: "/v1/requests",
          project: "Atlas",
          env: "Recette",
          service: "Traitements",
          state: "Active",
          version: 1,
          http: 422,
          body: { etat: "refused", code: "REQUEST_REJECTED" },
          runs: 12,
          tags: "Refus",
        },
        {
          id: "document",
          name: "Génération de document",
          method: "POST",
          route: "/v1/documents",
          project: "Studio",
          env: "Recette",
          service: "Documents",
          state: "Active",
          version: 2,
          http: 202,
          body: { etat: "pending", reference: "{{reference}}" },
          runs: 16,
          shared: true,
          hook: true,
          tags: "Webhook Asynchrone",
        },
        {
          id: "validation",
          name: "Validation de ressource",
          method: "POST",
          route: "/v1/resources",
          project: "Atlas",
          env: "Recette",
          service: "Ressources",
          state: "Active",
          version: 1,
          http: 400,
          body: { code: "INVALID_REQUEST", message: "Paramètre invalide" },
          runs: 8,
        },
        {
          id: "attente",
          name: "Acceptation sans référence",
          method: "POST",
          route: "/v1/requests",
          project: "Atlas",
          env: "Intégration",
          service: "Traitements",
          state: "Brouillon",
          version: 0,
          http: 202,
          body: { etat: "pending" },
          runs: 0,
        },
        {
          id: "historique",
          name: "Consultation de document",
          method: "GET",
          route: "/v1/documents/status",
          project: "Studio",
          env: "Intégration",
          service: "Documents",
          state: "Archivée",
          version: 1,
          http: 200,
          body: { etat: "ready" },
          runs: 4,
          shared: true,
        },
      ];
      const $ = (id) => document.getElementById(id);
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const normal = (v) =>
        String(v)
          .toLocaleLowerCase("fr")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      const icons = {
        more: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis lucide-more-horizontal" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>',
        folder:
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-folder" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>',
        close:
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>',
        preview:
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-right" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path></svg>',
        edit: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>',
        users:
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>',
      };
      let access = "Toutes",
        selected = items[0].id,
        openedMenu = null;
      const current = () => items.find((i) => i.id === selected);
      const mobile = matchMedia("(max-width:700px)");
      const stateBadge = (i) =>
        '<span class="state ' +
        (i.state === "Brouillon"
          ? "draft"
          : i.state === "Archivée"
            ? "archived"
            : "") +
        '">' +
        esc(i.state) +
        "</span>";
      function matchesAccess(i, key) {
        return key === "Toutes" || (key === "Partagées" ? i.shared : !i.shared);
      }
      function draw() {
        const scope = items.filter(
          (i) => !$("project").value || i.project === $("project").value,
        );
        const active = scope.filter((i) => i.state === "Active").length;
        $("summary").innerHTML =
          "<span><b>" +
          scope.length +
          "</b> simulation" +
          (scope.length > 1 ? "s" : "") +
          "</span><span><b>" +
          active +
          "</b> active" +
          (active > 1 ? "s" : "") +
          "</span><span><b>" +
          scope.filter((i) => !i.shared).reduce((s, i) => s + i.runs, 0) +
          "</b> exécutions conservées</span>";
        document.querySelectorAll("[data-access]").forEach((b) => {
          b.setAttribute("aria-pressed", String(b.dataset.access === access));
          b.querySelector(".count").textContent = scope.filter((i) =>
            matchesAccess(i, b.dataset.access),
          ).length;
        });
        const q = normal($("search").value.trim());
        const visible = scope.filter(
          (i) =>
            matchesAccess(i, access) &&
            (!$("state").value || i.state === $("state").value) &&
            (!$("service").value || i.service === $("service").value) &&
            (!$("environment").value || i.env === $("environment").value) &&
            normal(
              [i.name, i.route, i.project, i.service, i.tags || ""].join(" "),
            ).includes(q),
        );
        if (!visible.some((i) => i.id === selected)) selected = visible[0]?.id;
        const filters = ["state", "service", "environment"].filter(
          (k) => $(k).value,
        ).length;
        $("toggleFilters").querySelector("span").textContent = filters
          ? "Filtres · " + filters
          : "Filtres";
        $("rows").innerHTML =
          visible
            .map(
              (i) =>
                '<div class="row ' +
                (i.id === selected ? "chosen" : "") +
                '"><button class="selectRow" data-pick="' +
                esc(i.id) +
                '" aria-label="Aperçu de ' +
                esc(i.name) +
                '"><span><span class="rowHead">' +
                esc(i.name) +
                '</span><span class="route"><b>' +
                esc(i.method) +
                "</b><code>" +
                esc(i.route) +
                '</code></span><span class="rowContext">' +
                esc(i.project) +
                " / " +
                esc(i.env) +
                (i.shared ? " · Lecture partagée" : "") +
                "</span></span>" +
                stateBadge(i) +
                '</button><button class="more" data-menu="' +
                esc(i.id) +
                '" aria-expanded="' +
                (openedMenu === i.id) +
                '" aria-label="Actions pour ' +
                esc(i.name) +
                '">' +
                icons.more +
                "</button>" +
                (openedMenu === i.id
                  ? '<div class="menu">' + menu(i) + "</div>"
                  : "") +
                "</div>",
            )
            .join("") ||
          '<div class="empty">Aucune simulation pour cette recherche.<br><button data-action="reset">Effacer les filtres</button></div>';
        $("results").textContent =
          visible.length + " simulation(s) affichée(s)";
        renderPreview();
      }
      function menu(i) {
        const actions = [
          ["open", "Ouvrir"],
          ...(i.state === "Active" ? [["url", "Copier l’URL"]] : []),
          ["duplicate", "Dupliquer"],
          ...(!i.shared
            ? [
                ["share", "Partager"],
                ...(i.state === "Archivée" ? [] : [["archive", "Archiver"]]),
              ]
            : []),
        ];
        return actions
          .map(
            ([k, l]) =>
              '<button data-action="' +
              k +
              '" data-id="' +
              esc(i.id) +
              '">' +
              l +
              "</button>",
          )
          .join("");
      }
      function renderPreview() {
        const i = current();
        let content =
          '<p class="emptyPreview">Sélectionnez une simulation pour voir sa réponse.</p>';
        if (i) {
          const json = esc(JSON.stringify(i.body, null, 2)).replace(
            /(&quot;.*?&quot;)(:)?/g,
            (_, str, colon) =>
              '<span class="' +
              (colon ? "k" : "v") +
              '">' +
              str +
              "</span>" +
              (colon || ""),
          );
          content =
            '<div class="previewHead"><h2>Aperçu</h2><button class="closeBtn" aria-label="Fermer l’aperçu" data-action="closeSheet">' +
            icons.close +
            '</button></div><div class="tagLine">' +
            stateBadge(i) +
            '<span class="version">' +
            (i.version ? "v" + i.version : "Brouillon") +
            "</span></div><h3>" +
            esc(i.name) +
            '</h3><div class="context">' +
            icons.folder +
            esc(i.project) +
            " / " +
            esc(i.env) +
            '</div><div class="payload"><div class="file"><span>application/json</span><span class="http ' +
            (i.http < 400 ? "ok" : "") +
            '">HTTP ' +
            i.http +
            "</span></div><pre>" +
            json +
            "</pre></div><dl><div><dt>Service</dt><dd>" +
            esc(i.service) +
            "</dd></div><div><dt>Webhook</dt><dd>" +
            (i.hook ? "Différé · 120 s" : "Désactivé") +
            "</dd></div><div><dt>Accès</dt><dd>" +
            (i.shared ? "Lecture partagée" : "Mon projet") +
            '</dd></div></dl><button class="secondary" data-action="open">' +
            icons.edit +
            "Ouvrir la simulation</button>";
        }
        $("desktopPreview").innerHTML = content;
        $("mobilePreview").firstElementChild.innerHTML = content;
      }
      function reset() {
        for (const k of [
          "project",
          "search",
          "state",
          "service",
          "environment",
        ])
          $(k).value = "";
        access = "Toutes";
        openedMenu = null;
        draw();
      }
      function toast(msg) {
        $("toast").textContent = msg;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => ($("toast").textContent = ""), 2400);
      }
      function dialog(title, fields, label, submit) {
        $("dialogTitle").textContent = title;
        $("modalForm").innerHTML =
          fields + '<button class="cta">' + esc(label) + "</button>";
        $("modalForm").onsubmit = (e) => {
          e.preventDefault();
          submit(new FormData(e.target));
          $("modal").close();
        };
        $("modal").showModal();
      }
      const itemLabel = (i) =>
        esc(i.name) + " · " + esc(i.project) + " / " + esc(i.env);
      function action(key, i) {
        if (key === "reset") {
          reset();
          return;
        }
        if (key === "close") {
          $("modal").close();
          return;
        }
        if (key === "closeSheet") {
          $("mobilePreview").close();
          return;
        }
        if (!i) return;
        if (key === "open") {
          dialog(
            i.name,
            "<p>" +
              itemLabel(i) +
              '</p><div class="route"><b>' +
              esc(i.method) +
              "</b><code>" +
              esc(i.route) +
              "</code></div><p>Réponse configurée · HTTP " +
              i.http +
              "</p>",
            "Revenir à la bibliothèque",
            () => {},
          );
        }
        if (key === "url") {
          navigator.clipboard
            .writeText("https://relais.example.test/simulate/" + i.id + i.route)
            .then(
              () => toast("URL d’exemple copiée."),
              () => toast("Copie indisponible."),
            );
        }
        if (key === "duplicate") {
          const copy = {
            ...i,
            id: crypto.randomUUID(),
            name: i.name + " · copie",
            shared: false,
            project: "Atlas",
            env: "Recette",
            state: "Brouillon",
            version: 0,
            runs: 0,
            hook: false,
          };
          items.unshift(copy);
          selected = copy.id;
          reset();
          toast("Copie ajoutée à la maquette.");
        }
        if (key === "archive") {
          dialog(
            "Archiver la simulation ?",
            "<p>" + itemLabel(i) + "</p>",
            "Archiver",
            () => {
              i.state = "Archivée";
              draw();
            },
          );
        }
        if (key === "share") {
          dialog(
            "Partager la simulation",
            "<p>" +
              itemLabel(i) +
              '</p><label>Visibilité<select name="visibility"><option>Restreinte</option><option>Utilisateurs connectés</option></select></label><label>Adresse d’un utilisateur<input name="email" type="email" placeholder="collegue@example.test"></label>',
            "Enregistrer dans la maquette",
            (data) => {
              i.visibility = data.get("visibility");
              i.invited = data.get("email");
              toast("Partage simulé.");
            },
          );
          $("modalForm").elements.visibility.value =
            i.visibility || "Restreinte";
          $("modalForm").elements.email.value = i.invited || "";
        }
      }
      document.addEventListener("click", (e) => {
        const pick = e.target.closest("[data-pick]"),
          more = e.target.closest("[data-menu]"),
          act = e.target.closest("[data-action]");
        if (act) {
          const i = items.find((i) => i.id === act.dataset.id) || current();
          if (openedMenu) {
            openedMenu = null;
            draw();
          }
          action(act.dataset.action, i);
          return;
        }
        if (more) {
          openedMenu =
            openedMenu === more.dataset.menu ? null : more.dataset.menu;
          draw();
          if (openedMenu) document.querySelector(".menu button").focus();
          else
            $("rows")
              .querySelector('[data-menu="' + more.dataset.menu + '"]')
              .focus();
          return;
        }
        if (pick) {
          selected = pick.dataset.pick;
          openedMenu = null;
          draw();
          $("rows")
            .querySelector('[data-pick="' + selected + '"]')
            .focus({ preventScroll: true });
          if (mobile.matches) $("mobilePreview").showModal();
          return;
        }
        if (openedMenu) {
          openedMenu = null;
          draw();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (openedMenu) {
          let id = openedMenu;
          openedMenu = null;
          draw();
          document.querySelector('[data-menu="' + id + '"]').focus();
        } else if ($("nav").classList.contains("open")) {
          $("navBtn").click();
          $("navBtn").focus();
        }
      });
      $("create").onclick = () =>
        dialog(
          "Nouvelle simulation",
          '<label>Nom de la simulation<input name="name" required maxlength="80" autofocus></label><label>Route HTTP<input name="route" required value="/v1/requests" pattern="/.*"></label>',
          "Créer le brouillon",
          (data) => {
            const i = {
              ...items[0],
              name: data.get("name").trim() || "Sans titre",
              route: data.get("route"),
              id: crypto.randomUUID(),
              state: "Brouillon",
              method: "POST",
              version: 0,
              project: "Atlas",
              env: "Recette",
              service: "Traitements",
              http: 200,
              body: {},
              runs: 0,
              shared: false,
              hook: false,
            };
            items.unshift(i);
            selected = i.id;
            reset();
          },
        );
      $("navBtn").onclick = () =>
        $("navBtn").setAttribute(
          "aria-expanded",
          String($("nav").classList.toggle("open")),
        );
      $("toggleFilters").onclick = () => {
        const p = $("filters");
        p.hidden = !p.hidden;
        $("toggleFilters").setAttribute("aria-expanded", String(!p.hidden));
      };
      document.querySelectorAll("[data-access]").forEach(
        (b) =>
          (b.onclick = () => {
            access = b.dataset.access;
            openedMenu = null;
            draw();
          }),
      );
      for (const k of ["project", "state", "service", "environment"])
        $(k).onchange = () => {
          openedMenu = null;
          draw();
        };
      $("service").append(
        ...[...new Set(items.map((i) => i.service))].map(
          (v) => new Option(v, v),
        ),
      );
      $("search").oninput = () => {
        openedMenu = null;
        draw();
      };
      mobile.addEventListener("change", () => {
        if (!mobile.matches && $("mobilePreview").open)
          $("mobilePreview").close();
      });
      draw();
    </script>
  </body>
</html>
