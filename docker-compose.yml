name: relais-pilote
services:
  relais:
    build:
      context: frontend
      dockerfile: Dockerfile.relais
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAIS_PORT:-3210}:3210"
    environment:
      RELAIS_HOME: /var/lib/relais
      RELAIS_BIND: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - relais_data:/var/lib/relais
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  relais_data:
