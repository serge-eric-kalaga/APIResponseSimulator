name: Relais
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test:lab
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Recette HTTP avec notification à deux minutes
        run: |
          node scripts/lab-start.mjs --prod > "$RUNNER_TEMP/relais.log" 2>&1 &
          pilot_pid=$!
          trap 'kill "$pilot_pid" || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3210/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:acceptance
